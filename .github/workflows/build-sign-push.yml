name: Build Sign Push (starter)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# TODO (Fase 3): añade los permisos necesarios.
#   - packages: write  (push a GHCR)
#   - id-token: write  (firma keyless)
permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-sign-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TODO (Fase 2): setup-qemu-action y setup-buildx-action para multi-arch
      - name: Setup QEMU (para arquitecturas cruzadas)
        uses: docker/setup-qemu-action@v3
 
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # TODO (Fase 2): platforms multi-arch + caché type=gha
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      # TODO (Fase 3): instalar Cosign, firmar el DIGEST (no el tag) y verificar
      # Pista: usa steps.build.outputs.digest y cosign sign --yes IMAGE@DIGEST
      - name: Instalar Cosign
        uses: sigstore/cosign-installer@v3
 
      - name: Firmar el digest (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"      
 
      - name: Verificar la firma
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${{ steps.build.outputs.digest }}"
      
      - name: Resumen
        run: |
          {
            echo "### Imagen publicada y firmada"
            echo "- Referencia: \`${IMAGE}@${{ steps.build.outputs.digest }}\`"
            echo "- Plataformas: linux/amd64, linux/arm64"
            echo "- Firma: Cosign keyless (verificada)"
          } >> "$GITHUB_STEP_SUMMARY"
